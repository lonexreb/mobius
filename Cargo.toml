[workspace]
resolver = "2"
members = [
    "crates/mobius-core",
    "crates/mobius-bench",
    "crates/mobius-claw",
    "crates/mobius-cli",
    "crates/mobius-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paloa-labs/mobius"
description = "High-performance framework for autonomous ML experimentation"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
