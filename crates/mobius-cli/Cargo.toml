[package]
name = "mobius-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for autonomous ML experimentation"
keywords = ["ml", "experiment", "cli", "optimization"]
categories = ["command-line-utilities", "science"]
readme = "README.md"

[[bin]]
name = "mobius"
path = "src/main.rs"

[dependencies]
mobius-core = { path = "../mobius-core", version = "0.1.0" }
mobius-bench = { path = "../mobius-bench", version = "0.1.0" }
mobius-claw = { path = "../mobius-claw", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "6.0.0"
chrono.workspace = true
ratatui = "0.29"
crossterm = "0.28"
owo-colors = "4"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.27.0"
