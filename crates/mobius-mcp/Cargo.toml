[package]
name = "mobius-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing Mobius experiment tools via Model Context Protocol"
keywords = ["ml", "mcp", "experiment", "server"]
categories = ["science"]
readme = "README.md"

[[bin]]
name = "mobius-mcp"
path = "src/main.rs"

[dependencies]
mobius-core = { path = "../mobius-core", version = "0.1.0" }
mobius-bench = { path = "../mobius-bench", version = "0.1.0" }
mobius-claw = { path = "../mobius-claw", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dirs = "6"
rmcp = { version = "1.3", features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3.27.0"
