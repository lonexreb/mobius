[package]
name = "mobius-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing Mobius experiment tools via Model Context Protocol"

[[bin]]
name = "mobius-mcp"
path = "src/main.rs"

[dependencies]
mobius-core = { path = "../mobius-core" }
mobius-bench = { path = "../mobius-bench" }
mobius-claw = { path = "../mobius-claw" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dirs = "6"
rmcp = { version = "1.3", features = ["server", "transport-io"] }
